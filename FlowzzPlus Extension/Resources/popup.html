<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flowzz+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup__header">
      <img class="popup__icon" src="images/icon-96.png" alt="" width="40" height="40">
      <div>
        <h1 class="popup__title">flowzz+</h1>
        <p class="popup__subtitle">Safari web extension scaffold</p>
      </div>
    </header>

    <p class="popup__body">
      The extension is running. This popup is a placeholder and is replaced by
      the flowzz+ port.
    </p>

    <button class="popup__button" id="ping" type="button">Send test message</button>
    <p class="popup__status" id="status" role="status">Not sent yet.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
